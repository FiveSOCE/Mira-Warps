name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiraWarps-0.1.5
          path: build/libs/MiraWarps-0.1.5.jar
          if-no-files-found: error
      - name: Publish v0.1.5 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.5 >/dev/null 2>&1; then
            gh release create v0.1.5 \
              build/libs/MiraWarps-0.1.5.jar \
              --target "${{ github.sha }}" \
              --title "MiraWarps v0.1.5" \
              --notes "Fixes MiraWarps Spawn integration by dispatching the correct EssentialsSpawn namespaced commands, adds explicit missing-module/error feedback for /spawn and /setspawn, and declares EssentialsSpawn as the optional spawn backend."
          fi
