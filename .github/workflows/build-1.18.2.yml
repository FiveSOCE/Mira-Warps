name: MiraWarps Paper 1.18.2
on:
  push:
    branches: ['compat/1.18.2']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build Java 17 for Paper 1.18.2
        run: |
          for attempt in 1 2 3; do
            if gradle clean test build --no-daemon --stacktrace; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
      - name: Verify plugin
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/MiraWarps_1.18.2.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -Fx plugin.yml
          jar tf "$JAR" | grep -Fx com/mira/warps/MiraWarpsPlugin.class
          javap -verbose -classpath "$JAR" com.mira.warps.MiraWarpsPlugin | grep -F 'major version: 61'
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '1.18'"
      - uses: actions/upload-artifact@v4
        with:
          name: MiraWarps_1.18.2
          path: build/libs/MiraWarps_1.18.2.jar
          if-no-files-found: error
      - name: Publish legacy JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-1.18.2 >/dev/null 2>&1 || gh release create dev-1.18.2 --prerelease --title 'MiraWarps Paper 1.18.2' --notes 'Java 17, Paper 1.18.2. Requires version-compatible EssentialsX; EssentialsSpawn for /spawn. In-game testing pending.' --target "$GITHUB_SHA"
          gh release upload dev-1.18.2 build/libs/MiraWarps_1.18.2.jar --clobber
